name: RoadAudit AI checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-ci.txt
      - name: Compile Python source
        run: python -m compileall app.py backend ai utils
      - name: Run automated tests
        run: python -m unittest discover -s tests -v
